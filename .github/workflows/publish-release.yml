# =============================================================================
# publish-release.yml — incoming/<태그>/ 에 올려 둔 파일들을 GitHub 릴리스로 게시
# -----------------------------------------------------------------------------
# [왜 필요한가]
#   Capri 자동 업데이트(electron-updater)는 이 저장소의 "GitHub 릴리스" 기능(태그 +
#   첨부파일)을 본다. 릴리스에 파일을 붙이려면 별도 권한(개인 토큰)이 보통 필요한데,
#   이 워크플로는 GitHub Actions가 저장소마다 자동으로 주는 GITHUB_TOKEN(자기 저장소
#   안에서는 쓰기 권한 있음)만으로 동작한다 — 개인 토큰을 새로 안 만들어도 된다.
#
# [쓰는 법]
#   1) 빌드된 설치파일(exe)·blockmap·latest.yml 을 이 저장소의
#      incoming/<태그>/ (예: incoming/v0.24.1/) 아래에 커밋·푸시한다.
#   2) 이 워크플로를 수동 실행(workflow_dispatch)하며 태그를 입력한다.
#   3) 릴리스가 없으면 새로 만들고, incoming/<태그>/ 안의 모든 파일을 첨부한다.
#   4) 다 올리면 incoming/<태그>/ 는 저장소에서 지운다(레포를 가볍게 유지 — 파일의
#      진짜 보관 장소는 이제 "릴리스 첨부파일"이다).
# =============================================================================
name: publish-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v0.24.1)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 릴리스 생성(없으면) + 파일 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          DIR="incoming/$TAG"

          if [ ! -d "$DIR" ] || [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "::error::$DIR 에 올릴 파일이 없습니다. 먼저 파일을 커밋·푸시하세요."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "기존 릴리스 재사용: $TAG"
          else
            gh release create "$TAG" --title "Capri $TAG" --notes "Capri $TAG 배포"
          fi

          for f in "$DIR"/*; do
            echo "업로드: $f"
            gh release upload "$TAG" "$f" --clobber
          done

      - name: incoming/<태그> 정리(더 이상 필요 없음 — 릴리스 첨부파일이 진짜 보관 장소)
        run: |
          TAG="${{ inputs.tag }}"
          git config user.name "capri-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r --quiet "incoming/$TAG"
          git commit -m "release: $TAG 게시 완료, 임시 파일 정리" || echo "정리할 변경 없음"
          git push
